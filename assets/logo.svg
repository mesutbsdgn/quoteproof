<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="t d">
  <title id="t">Quoteproof</title>
  <desc id="d">A quotation mark with a verification check, next to the word Quoteproof and the tagline Research you can check.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4F46E5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- badge -->
  <g filter="url(#soft)">
    <rect x="28" y="30" width="160" height="160" rx="38" fill="url(#badge)"/>
  </g>
  <rect x="28" y="30" width="160" height="160" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- opening quotation mark: two "6"-shaped marks -->
  <g fill="#FFFFFF">
    <circle cx="74" cy="92" r="17"/>
    <path d="M90 92 C90 118 80 134 60 142 L60 126 C70 120 75 112 75 102 Z"/>
    <circle cx="124" cy="92" r="17"/>
    <path d="M140 92 C140 118 130 134 110 142 L110 126 C120 120 125 112 125 102 Z"/>
  </g>

  <!-- proof check -->
  <circle cx="158" cy="160" r="30" fill="#10B981" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M144 160 L154 170 L173 150" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="222" y="118" font-family="Inter, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#word)">Quoteproof</text>
  <text x="225" y="156" font-family="Inter, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="0.3" fill="#8B949E">Research you can check.</text>
  <rect x="225" y="172" width="64" height="5" rx="2.5" fill="#10B981"/>
</svg>
